name: Fortress CipherVaultX CI (CVZ v1)

on:
  push:
    branches: ["feat/cvz-v1", "main", "release-apk"]
    paths:
      - "ciphervaultx/**"
      - ".github/workflows/cvz-ci.yml"
  pull_request:
    paths:
      - "ciphervaultx/**"
      - ".github/workflows/cvz-ci.yml"
  workflow_dispatch:

concurrency:
  group: cvz-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CVZ_PRIVATE_ACCESS_HASH: ${{ secrets.CVZ_PRIVATE_ACCESS_HASH }}

jobs:
  frontend:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run Vitest
        run: npm test
      - name: Build TypeScript & Vite bundle
        run: npm run build

  rust-linux:
    name: Rust Linux (Fmt, Clippy, Tests, Workspace Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend dist (required by tauri::generate_context!)
        run: |
          npm install
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ciphervaultx
      - name: Format check
        run: set -o pipefail; cargo fmt --all -- --check 2>&1 | tee /tmp/ci-step.log
      - name: Clippy (-D warnings)
        run: set -o pipefail; cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/ci-step.log
      - name: Test cvz-core (--all-features, dev)
        run: set -o pipefail; cargo test -p cvz-core --all-features 2>&1 | tee /tmp/ci-step.log
      - name: Test cvz-core (--all-features, release)
        run: set -o pipefail; cargo test -p cvz-core --release --all-features 2>&1 | tee /tmp/ci-step.log
      - name: Build workspace
        run: set -o pipefail; cargo build --workspace 2>&1 | tee /tmp/ci-step.log

  rust-windows:
    name: Windows (Build, Tests, NSIS .exe Bundle)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies and build
        run: |
          npm install
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ciphervaultx
      - name: Build workspace
        shell: bash
        run: set -o pipefail; cargo build --workspace
      - name: Test cvz-core (--all-features)
        shell: bash
        run: set -o pipefail; cargo test -p cvz-core --all-features
      - name: Build Windows NSIS installer (.exe)
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --bundles nsis
          cp "target/release/bundle/nsis/Fortress CipherVaultX_0.2.0_x64-setup.exe" ../Fortress-CipherVaultX-v0.2.0-windows-x64-setup.exe
          ls -lh ../Fortress-CipherVaultX-v0.2.0-windows-x64-setup.exe
      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Fortress-CipherVaultX-Windows-exe
          path: Fortress-CipherVaultX-v0.2.0-windows-x64-setup.exe

  android-apk:
    name: Android (Core Cross-Compile & Signed Upgradeable APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Restore persistent Android signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cvz-android-persistent-keystore-v2
      - name: Ensure consistent Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Loaded Android keystore from GitHub Secret."
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Fortress CipherVaultX, OU=Personal, O=CipherVaultX, L=Local, S=Local, C=US"
            echo "Generated persistent Android keystore (cached for future in-place upgrades)."
          else
            echo "Reusing cached persistent Android keystore for seamless in-place upgrade."
          fi
      - name: Configure pre-installed Android SDK & NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_DIR=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
            NDK_DIR="$SDK/ndk/26.3.11579264"
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install frontend dependencies & build
        run: |
          npm install
          npm run build
      - name: Initialize Tauri Android project & build signed APK (v0.2.0)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.png
          python3 scripts/patch_android.py
          npx tauri android build --apk --debug --target aarch64
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk ../Fortress-CipherVaultX-v0.2.0-android-signed.apk
          ls -lh ../Fortress-CipherVaultX-v0.2.0-android-signed.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Fortress-CipherVaultX-Android-apk
          path: Fortress-CipherVaultX-v0.2.0-android-signed.apk

  ios-ipa:
    name: iOS (Core Cross-Compile & Unsigned IPA)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install frontend dependencies & build
        run: |
          npm install
          npm run build
      - name: Initialize Tauri iOS project & build unsigned IPA
        run: |
          set -o pipefail
          npx tauri ios init --ci 2>&1 | tee /tmp/ci-ios.log
          npx tauri icon src-tauri/icons/icon.png 2>&1 | tee -a /tmp/ci-ios.log
          PBX=$(find src-tauri/gen/apple -maxdepth 3 -name "project.pbxproj" | head -n 1)
          echo "Patching unsigned build settings in: $PBX" | tee -a /tmp/ci-ios.log
          python3 - "$PBX" <<'PY'
          import sys
          p = sys.argv[1]
          txt = open(p).read()
          txt = txt.replace(
              "buildSettings = {",
              "buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";",
          )
          open(p, "w").write(txt)
          PY
          npx tauri ios build --ci --debug --target aarch64 2>&1 | tee -a /tmp/ci-ios.log || true
          APP_PATH=$(find src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -name "*.app" \( -path "*Applications*" -o -path "*iphoneos*" \) 2>/dev/null | head -n 1)
          echo "Built app bundle: $APP_PATH" | tee -a /tmp/ci-ios.log
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No compiled iOS .app bundle found" | tee -a /tmp/ci-ios.log
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ../Fortress-CipherVaultX-v0.2.0-ios-unsigned.ipa Payload
          ls -lh ../Fortress-CipherVaultX-v0.2.0-ios-unsigned.ipa
      - name: Upload iOS Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fortress-CipherVaultX-iOS-ipa
          path: Fortress-CipherVaultX-v0.2.0-ios-unsigned.ipa
      - name: Report iOS failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          log = ""
          if os.path.exists("/tmp/ci-ios.log"):
              lines = open("/tmp/ci-ios.log", errors="replace").read().splitlines()
              log = "\n".join(lines[-80:])
          body = f"### CI failure: ios-ipa\n```\n{log}\n```"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          urllib.request.urlopen(req).read()
          PY

  publish-release:
    name: Publish GitHub Release (v0.2.0-fortress)
    runs-on: ubuntu-latest
    needs: [frontend, rust-linux, rust-windows, android-apk, ios-ipa]
    if: github.event_name != 'pull_request'
    steps:
      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Fortress-CipherVaultX-Android-apk
          path: release-assets
      - name: Download Windows NSIS .exe artifact
        uses: actions/download-artifact@v4
        with:
          name: Fortress-CipherVaultX-Windows-exe
          path: release-assets
      - name: Download iOS IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Fortress-CipherVaultX-iOS-ipa
          path: release-assets
      - name: Verify direct installer assets (.apk, .exe, .ipa)
        run: |
          ls -lh release-assets/
          test -f release-assets/Fortress-CipherVaultX-v0.2.0-android-signed.apk
          test -f release-assets/Fortress-CipherVaultX-v0.2.0-windows-x64-setup.exe
          test -f release-assets/Fortress-CipherVaultX-v0.2.0-ios-unsigned.ipa
      - name: Publish direct installers to GitHub Release v0.2.0-fortress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.2.0-fortress"
          APK="release-assets/Fortress-CipherVaultX-v0.2.0-android-signed.apk"
          EXE="release-assets/Fortress-CipherVaultX-v0.2.0-windows-x64-setup.exe"
          IPA="release-assets/Fortress-CipherVaultX-v0.2.0-ios-unsigned.ipa"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$EXE" "$IPA" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$EXE" "$IPA" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Fortress CipherVaultX v0.2.0" \
              --notes "Direct installers (no .zip) for Android (.apk), Windows (.exe), and iOS (.ipa)."
          fi

