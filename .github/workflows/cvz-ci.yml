name: Fortress CipherVaultX CI (CVZ v1)

on:
  push:
    branches: ["feat/cvz-v1", "main", "release-apk"]
    paths:
      - "ciphervaultx/**"
      - ".github/workflows/cvz-ci.yml"
  pull_request:
    paths:
      - "ciphervaultx/**"
      - ".github/workflows/cvz-ci.yml"
  workflow_dispatch:

concurrency:
  group: cvz-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run Vitest
        run: npm test
      - name: Build TypeScript & Vite bundle
        run: npm run build

  rust-linux:
    name: Rust Linux (Fmt, Clippy, Tests, Workspace Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend dist (required by tauri::generate_context!)
        run: |
          npm install
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ciphervaultx
      - name: Format check
        run: set -o pipefail; cargo fmt --all -- --check 2>&1 | tee /tmp/ci-step.log
      - name: Clippy (-D warnings)
        run: set -o pipefail; cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/ci-step.log
      - name: Test cvz-core (--all-features, dev)
        run: set -o pipefail; cargo test -p cvz-core --all-features 2>&1 | tee /tmp/ci-step.log
      - name: Test cvz-core (--all-features, release)
        run: set -o pipefail; cargo test -p cvz-core --release --all-features 2>&1 | tee /tmp/ci-step.log
      - name: Build workspace
        run: set -o pipefail; cargo build --workspace 2>&1 | tee /tmp/ci-step.log

  rust-windows:
    name: Windows (Build, Tests, NSIS .exe Bundle)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies and build
        run: |
          npm install
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ciphervaultx
      - name: Build workspace
        shell: bash
        run: set -o pipefail; cargo build --workspace
      - name: Test cvz-core (--all-features)
        shell: bash
        run: set -o pipefail; cargo test -p cvz-core --all-features
      - name: Build Windows NSIS installer (.exe)
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --bundles nsis
          cp "target/release/bundle/nsis/Fortress CipherVaultX_0.1.0_x64-setup.exe" ../Fortress-CipherVaultX-v0.1.0-windows-x64-setup.exe
          ls -lh ../Fortress-CipherVaultX-v0.1.0-windows-x64-setup.exe
      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Fortress-CipherVaultX-Windows-exe
          path: Fortress-CipherVaultX-v0.1.0-windows-x64-setup.exe

  android-apk:
    name: Android (Core Cross-Compile & Debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Configure pre-installed Android SDK & NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_DIR=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
            NDK_DIR="$SDK/ndk/26.3.11579264"
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install frontend dependencies & build
        run: |
          npm install
          npm run build
      - name: Initialize Tauri Android project & build debug APK
        run: |
          set -o pipefail
          npx tauri android init --ci
          npx tauri android build --apk --debug --target aarch64
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk ../Fortress-CipherVaultX-v0.1.0-android-debug.apk
          ls -lh ../Fortress-CipherVaultX-v0.1.0-android-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Fortress-CipherVaultX-Android-apk
          path: Fortress-CipherVaultX-v0.1.0-android-debug.apk

  ios-ipa:
    name: iOS (Core Cross-Compile & Unsigned IPA)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install frontend dependencies & build
        run: |
          npm install
          npm run build
      - name: Initialize Tauri iOS project & build unsigned IPA
        run: |
          set -o pipefail
          npx tauri ios init --ci
          PROJ=$(find src-tauri/gen/apple -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          echo "Detected Xcode project: $PROJ"
          SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{f=1;next} f && NF{gsub(/^[ \t]+/,""); print; exit}')
          echo "Detected Xcode scheme: $SCHEME"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build-ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH=$(find build-ios/Build/Products -maxdepth 3 -name "*.app" | head -n 1)
          echo "Built app bundle: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ../Fortress-CipherVaultX-v0.1.0-ios-unsigned.ipa Payload
          ls -lh ../Fortress-CipherVaultX-v0.1.0-ios-unsigned.ipa
      - name: Upload iOS Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fortress-CipherVaultX-iOS-ipa
          path: Fortress-CipherVaultX-v0.1.0-ios-unsigned.ipa
