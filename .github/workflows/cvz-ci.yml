name: Fortress CipherVaultX CI (CVZ v1)

on:
  push:
    branches: ["feat/cvz-v1", "main", "release-apk"]
    paths:
      - "ciphervaultx/**"
      - ".github/workflows/cvz-ci.yml"
  pull_request:
    paths:
      - "ciphervaultx/**"
      - ".github/workflows/cvz-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run Vitest
        run: npm test
      - name: Build TypeScript & Vite bundle
        run: npm run build

  rust-linux:
    name: Rust Linux (Fmt, Clippy, Tests, Workspace Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend dist (required by tauri::generate_context!)
        run: |
          npm install
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ciphervaultx
      - name: Format check
        run: set -o pipefail; cargo fmt --all -- --check 2>&1 | tee /tmp/ci-step.log
      - name: Clippy (-D warnings)
        run: set -o pipefail; cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/ci-step.log
      - name: Test cvz-core (--all-features, dev)
        run: set -o pipefail; cargo test -p cvz-core --all-features 2>&1 | tee /tmp/ci-step.log
      - name: Test cvz-core (--all-features, release)
        run: set -o pipefail; cargo test -p cvz-core --release --all-features 2>&1 | tee /tmp/ci-step.log
      - name: Build workspace
        run: set -o pipefail; cargo build --workspace 2>&1 | tee /tmp/ci-step.log
      - name: Report failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          log = ""
          if os.path.exists("/tmp/ci-step.log"):
              lines = open("/tmp/ci-step.log", errors="replace").read().splitlines()
              log = "\n".join(lines[-80:])
          body = f"### CI failure: rust-linux\n```\n{log}\n```"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          urllib.request.urlopen(req).read()
          PY

  rust-windows:
    name: Windows (Build, Tests, NSIS .exe Bundle)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies and build
        run: |
          npm install
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ciphervaultx
      - name: Build workspace
        shell: bash
        run: set -o pipefail; cargo build --workspace 2>&1 | tee ci-win.log
      - name: Test cvz-core (--all-features)
        shell: bash
        run: set -o pipefail; cargo test -p cvz-core --all-features 2>&1 | tee ci-win.log
      - name: Build Windows NSIS installer (.exe)
        shell: bash
        run: set -o pipefail; npx tauri build --bundles nsis 2>&1 | tee ci-win.log
      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Fortress-CipherVaultX-Windows-exe
          path: ciphervaultx/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Report failure diagnostics
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          log = ""
          if os.path.exists("ci-win.log"):
              lines = open("ci-win.log", errors="replace").read().splitlines()
              log = "\n".join(lines[-80:])
          body = f"### CI failure: rust-windows\n```\n{log}\n```"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          urllib.request.urlopen(req).read()
          PY

  android-apk:
    name: Android (Core Cross-Compile & Debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Configure pre-installed Android SDK & NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_DIR=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
            NDK_DIR="$SDK/ndk/26.3.11579264"
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install frontend dependencies & build
        run: |
          npm install
          npm run build
      - name: Initialize Tauri Android project & build debug APK
        run: |
          set -o pipefail
          npx tauri android init --ci 2>&1 | tee /tmp/ci-android.log
          npx tauri android build --apk --debug --target aarch64 2>&1 | tee -a /tmp/ci-android.log
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Fortress-CipherVaultX-Android-apk
          path: ciphervaultx/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Report failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          log = ""
          if os.path.exists("/tmp/ci-android.log"):
              lines = open("/tmp/ci-android.log", errors="replace").read().splitlines()
              log = "\n".join(lines[-80:])
          body = f"### CI failure: android-apk\n```\n{log}\n```"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          urllib.request.urlopen(req).read()
          PY
