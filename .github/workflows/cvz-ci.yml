name: Fortress CipherVaultX CI (CVZ v1)

on:
  push:
    branches: ["feat/cvz-v1", "main", "release-apk"]
    paths:
      - "ciphervaultx/**"
      - ".github/workflows/cvz-ci.yml"
  pull_request:
    paths:
      - "ciphervaultx/**"
      - ".github/workflows/cvz-ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run Vitest
        run: npm test
      - name: Build TypeScript & Vite bundle
        run: npm run build

  rust-linux:
    name: Rust Linux (Fmt, Clippy, Tests, Workspace Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend dist (required by tauri::generate_context!)
        run: |
          npm install
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ciphervaultx
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test cvz-core (--all-features, dev)
        run: cargo test -p cvz-core --all-features
      - name: Test cvz-core (--all-features, release)
        run: cargo test -p cvz-core --release --all-features
      - name: Build workspace
        run: cargo build --workspace

  rust-windows:
    name: Windows (Build, Tests, NSIS .exe Bundle)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies and build
        run: |
          npm install
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ciphervaultx
      - name: Build workspace
        run: cargo build --workspace
      - name: Test cvz-core (--all-features)
        run: cargo test -p cvz-core --all-features
      - name: Build Windows NSIS installer (.exe)
        run: npx tauri build --bundles nsis
      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Fortress-CipherVaultX-Windows-exe
          path: ciphervaultx/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android-apk:
    name: Android (Core Cross-Compile & Debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciphervaultx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK & build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install frontend dependencies & build
        run: |
          npm install
          npm run build
      - name: Initialize Tauri Android project & build debug APK
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --debug --target aarch64
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Fortress-CipherVaultX-Android-apk
          path: ciphervaultx/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
