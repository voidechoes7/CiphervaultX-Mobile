[package]
name = "ciphervaultx-app"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false
description = "Fortress / CipherVaultX Tauri 2 desktop & mobile shell (pre-audit)"

[lib]
name = "ciphervaultx_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Tauri build script (MIT OR Apache-2.0)
tauri-build = { version = "2", features = [] }

[dependencies]
# Core CVZ v1 cryptography and vault engine (Proprietary — All Rights Reserved)
cvz-core = { path = "../crates/cvz-core" }
# Base64 for in-memory preview payloads (MIT OR Apache-2.0)
base64 = "0.22"
# Platform config directory lookup (MIT OR Apache-2.0)
dirs = "5"
# Serialization (MIT OR Apache-2.0)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tauri 2 runtime (MIT OR Apache-2.0)
tauri = { version = "2", features = [] }
# Tauri 2 native file/folder picker dialog plugin (MIT OR Apache-2.0)
tauri-plugin-dialog = "2"
# Tauri 2 native filesystem plugin for iOS File Provider / Android content URI fallback (MIT OR Apache-2.0)
tauri-plugin-fs = "2"
# RAII temporary staging files for iOS File Provider fallback (MIT OR Apache-2.0)
tempfile = "3"
# Async runtime for auto-lock timer, blocking I/O offload, and loopback WebDAV drive (MIT)
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "net", "io-util", "macros"] }
# Random UUIDs for known vault registry IDs (MIT OR Apache-2.0)
uuid = { version = "1", features = ["v4"] }
