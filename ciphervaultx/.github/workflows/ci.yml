name: Fortress CipherVaultX CI (CVZ v1)

on:
  push:
    branches: ["feat/cvz-v1", "main", "release-apk"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (Test & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - run: npm run build

  rust-linux:
    name: Rust Linux (Fmt, Clippy, Tests, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p cvz-core --all-features
      - run: cargo test -p cvz-core --release --all-features
      - run: cargo build --workspace

  rust-windows:
    name: Windows (Build, Tests, NSIS .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace
      - run: cargo test -p cvz-core --all-features
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Fortress-CipherVaultX-Windows-exe
          path: target/release/bundle/nsis/*.exe

  android-apk:
    name: Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm install && npm run build
      - run: npx tauri android init --ci && npx tauri android build --apk --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: Fortress-CipherVaultX-Android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
